<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DRAW ROOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a3550; --sub:#8c86a3; --paper:#ffffff;
    --sky:#99ccff; --lav:#e3c4ee; --pink:#ffd3e4; --mint:#cdf1df; --butter:#fff1bd;
    --line:#ece4f5; --soft:#f7f3fc;
    --grad:linear-gradient(135deg,#a9d3ff 0%,#e7c8ef 100%);
    --shadow:0 6px 20px rgba(160,140,210,.22);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
    --font:"Zen Maru Gothic","M PLUS Rounded 1c",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{position:fixed;inset:0}
  button{font-family:var(--font)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
  #cv.pan{cursor:grab} #cv.panning{cursor:grabbing}
  #peers-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .peer-tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;transition:opacity .3s;will-change:transform}
  .peer-tag i{width:12px;height:12px;border:2.5px solid #fff;display:block;border-radius:50%;box-shadow:0 1px 4px rgba(58,53,80,.25)}
  .peer-tag span{font:700 11px/1 var(--font);background:#fff;color:var(--ink);padding:5px 8px;border-radius:999px;white-space:nowrap;
    max-width:120px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(160,140,210,.3)}

  /* ---------- HEADER ---------- */
  .hud-top{position:absolute;top:calc(var(--safe-t) + 10px);left:calc(var(--safe-l) + 10px);right:calc(var(--safe-r) + 10px);
    display:flex;align-items:flex-start;gap:8px;pointer-events:none}
  .brand{pointer-events:auto;background:#fff;border-radius:18px;padding:7px 12px 6px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
  .brand img{height:26px;width:auto;display:block}
  .brand b{font:800 10px/1 "M PLUS Rounded 1c",var(--font);letter-spacing:.12em;color:var(--sub);padding-left:2px}
  .online{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;height:44px;padding:0 10px 0 12px;
    box-shadow:var(--shadow);min-width:0}
  .dot-live{width:8px;height:8px;border-radius:50%;background:#7fdcae;flex:none;box-shadow:0 0 0 3px #e3f8ee}
  .dot-live.off{background:#cfc9dc;box-shadow:0 0 0 3px #f1eef6}
  .online .num{font:800 16px/1 "M PLUS Rounded 1c",var(--font)}
  .online .lbl{font:700 11px/1 var(--font);color:var(--sub)}
  .avatars{display:flex;margin-left:2px}
  .av{width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;margin-left:-8px;display:grid;place-items:center;
    font:900 11px/1 var(--font);color:var(--ink);flex:none}
  .av:first-child{margin-left:0}
  .spacer{flex:1}
  .sqbtn{pointer-events:auto;width:44px;height:44px;border:0;background:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    color:var(--ink);padding:0;box-shadow:var(--shadow);transition:transform .15s,background .15s}
  .sqbtn:hover{background:var(--soft)} .sqbtn:active{transform:scale(.92)}
  .sqbtn svg{width:20px;height:20px}
  .zoom{pointer-events:none;font:700 11px/1 var(--font);color:var(--sub);position:absolute;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:999px;
    top:calc(var(--safe-t) + 62px);right:calc(var(--safe-r) + 12px)}

  /* side toggles */
  .side{position:absolute;right:calc(var(--safe-r) + 10px);top:calc(var(--safe-t) + 96px);display:flex;flex-direction:column;gap:8px}
  .side .sqbtn{width:40px;height:40px}
  .side .sqbtn svg{width:19px;height:19px}
  .side .sqbtn.on{background:var(--grad)}
  /* minimap */
  .map{position:absolute;right:calc(var(--safe-r) + 10px);bottom:calc(var(--dockH,140px) + 12px);background:#fff;border-radius:18px;
    box-shadow:0 6px 22px rgba(160,140,210,.3);padding:8px 8px 7px;display:none;flex-direction:column;gap:5px;touch-action:none;cursor:pointer}
  .map.open{display:flex}
  .map canvas{width:112px;height:112px;display:block;border-radius:12px}
  .map .cap{display:flex;justify-content:space-between;align-items:center;font:700 11px/1 var(--font);color:var(--sub);padding:0 2px}
  .map .cap b{font:800 12px/1 "M PLUS Rounded 1c",var(--font);color:var(--ink);background:var(--soft);padding:4px 7px;border-radius:999px}

  /* ---------- TOOLBAR ---------- */
  .dock{position:absolute;left:calc(var(--safe-l) + 8px);right:calc(var(--safe-r) + 8px);bottom:calc(var(--safe-b) + 8px);
    background:#fff;border-radius:26px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px;max-width:620px;margin:0 auto;
    box-shadow:0 8px 30px rgba(160,140,210,.3);border:2px solid #f3edf9}
  .row{display:flex;align-items:center;gap:6px}
  .colors{overflow-x:auto;scrollbar-width:none;padding:8px 8px;gap:8px;margin:-3px -4px}
  .colors::-webkit-scrollbar{display:none}
  .sw{flex:none;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1.5px rgba(58,53,80,.08);transition:transform .15s}
  .sw.on{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ink)}
  .sw.custom{background:conic-gradient(from 180deg,#ff9fc0,#ffd36e,#8ee0b4,#7cc8ff,#b39dff,#ff9fc0);display:grid;place-items:center}
  .sw.custom i{width:16px;height:16px;border-radius:50%;background:#fff;display:grid;place-items:center;font:900 14px/1 var(--font);color:var(--ink);font-style:normal}
  .sw.custom.has i{width:20px;height:20px;border:2.5px solid #fff;font-size:0}

  /* ---------- COLOR PICKER ---------- */
  .picker{position:absolute;left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 16px));background:#fff;border-radius:24px;
    box-shadow:0 10px 36px rgba(160,140,210,.36);padding:14px;display:none;flex-direction:column;gap:12px;z-index:5}
  .picker.open{display:flex}
  .picker .hd{display:flex;align-items:center;justify-content:space-between;font:700 13px/1 var(--font)}
  .picker .x{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 16px/1 var(--font)}
  .sv{position:relative;height:150px;border-radius:16px;touch-action:none;cursor:crosshair}
  .sv::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
  .sv::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(0deg,#000,rgba(0,0,0,0))}
  .hue{position:relative;height:22px;border-radius:999px;touch-action:none;cursor:pointer;
    background:linear-gradient(90deg,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
  .knob{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none;z-index:2}
  .hue .knob{top:50%}
  .pk-row{display:flex;align-items:center;gap:10px}
  .pk-prev{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(58,53,80,.1)}
  .pk-hex{flex:1;min-width:0;height:40px;border:0;background:var(--soft);border-radius:12px;padding:0 12px;font:700 15px/1 var(--font);color:var(--ink);
    -webkit-user-select:text;user-select:text;text-transform:uppercase}
  .pk-hex:focus{outline:2px solid var(--sky)}
  .pk-ok{all:unset;cursor:pointer;height:40px;padding:0 18px;border-radius:999px;background:var(--grad);font:700 14px/40px var(--font);color:var(--ink)}
  .pk-recent{display:flex;gap:8px;flex-wrap:wrap;min-height:26px;align-items:center}
  .pk-recent span{font:700 11px/1 var(--font);color:var(--sub);margin-right:2px}
  .pk-recent button{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(58,53,80,.1)}
  .sep{width:1.5px;height:30px;background:var(--line);flex:none;margin:0 1px;border-radius:2px}
  .tool{flex:1;min-width:0;height:48px;border:0;background:var(--soft);color:var(--ink);border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0;transition:background .15s,transform .15s}
  .tool:active{transform:scale(.95)}
  .tool svg{width:19px;height:19px}
  .tool em{font:700 10px/1 var(--font);font-style:normal;white-space:nowrap}
  .tool.on{background:var(--grad);color:var(--ink)}
  .tool:disabled{opacity:.35}
  .size{flex:none;width:38px;height:48px;border:0;background:var(--soft);border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:0}
  .size i{display:block;background:var(--ink);border-radius:50%}
  .size.on{background:var(--pink)}
  .meta{display:flex;justify-content:space-between;font:700 10px/1 var(--font);color:var(--sub);padding:0 6px}

  /* ---------- PANELS / DIALOG / TOAST ---------- */
  .people,.menu{position:absolute;top:calc(var(--safe-t) + 64px);background:#fff;border-radius:20px;box-shadow:0 10px 32px rgba(160,140,210,.32);overflow:hidden;display:none;flex-direction:column}
  .people{left:calc(var(--safe-l) + 10px);min-width:240px;max-width:calc(100% - 20px);max-height:50vh;overflow:auto}
  .menu{right:calc(var(--safe-r) + 10px);min-width:220px;max-width:min(290px,calc(100% - 20px))}
  .people.open,.menu.open{display:flex}
  .people .hd{font:700 11px/1 var(--font);color:var(--sub);padding:13px 16px 9px;display:flex;justify-content:space-between}
  .people button,.menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font:700 14px/1.2 var(--font);color:var(--ink)}
  .people button:hover,.menu button:hover{background:var(--soft)}
  .people button .av{margin:0;border-color:#fff}
  .people button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .people button small,.menu button small{font:700 11px/1 var(--font);color:var(--sub);margin-left:auto}
  .people button[disabled]{cursor:default;opacity:.6}
  .menu .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:15px}
  .menu .danger{color:#d9517a}
  .menu .note{padding:11px 16px 14px;font:500 12px/1.6 var(--font);color:var(--sub);background:var(--soft)}

  .scrim{position:absolute;inset:0;background:rgba(58,53,80,.28);display:none;align-items:center;justify-content:center;padding:20px}
  .scrim.open{display:flex}
  .dialog{background:#fff;border-radius:26px;width:100%;max-width:330px;padding:22px 20px 18px;text-align:center;box-shadow:0 12px 40px rgba(120,100,180,.3)}
  .dialog .no{width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--pink);display:grid;place-items:center;color:#d9517a}
  .dialog .no svg{width:28px;height:28px}
  .dialog h3{margin:14px 0 6px;font:900 17px/1.4 var(--font)}
  .dialog p{margin:0 0 18px;font:500 14px/1.6 var(--font);color:var(--sub)}
  .dialog .acts{display:flex;gap:8px}
  .dialog button{flex:1;height:46px;border-radius:999px;border:0;font:700 14px/1 var(--font);cursor:pointer;background:var(--soft);color:var(--ink)}
  .dialog button.primary{background:#ff8fb1;color:#fff}

  .toast{position:absolute;left:50%;top:calc(var(--safe-t) + 66px);transform:translateX(-50%);background:var(--ink);color:#fff;
    font:700 13px/1.4 var(--font);padding:10px 16px;border-radius:999px;max-width:calc(100% - 40px);text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .status{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 112px);font:700 12px/1.4 var(--font);
    color:var(--sub);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap;pointer-events:none;display:none;box-shadow:var(--shadow)}
  .status.show{display:block}


  /* ---------- DAILY RESET ---------- */
  .reset{position:absolute;left:calc(var(--safe-l) + 10px);top:calc(var(--safe-t) + 70px);display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.94);border-radius:999px;padding:6px 12px 6px 10px;box-shadow:var(--shadow);pointer-events:none;
    font:700 11px/1 var(--font);color:var(--sub)}
  .reset svg{width:14px;height:14px;flex:none}
  .reset b{font:800 13px/1 "M PLUS Rounded 1c",var(--font);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .reset.soon{background:#ffe1eb;color:#c2416c}
  .reset.soon b{color:#c2416c}
  .reset-big{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;display:none;
    background:rgba(255,255,255,.92);border-radius:28px;padding:18px 26px 20px;text-align:center;box-shadow:0 12px 40px rgba(160,140,210,.32)}
  .reset-big.show{display:block}
  .reset-big p{margin:0 0 6px;font:700 13px/1.5 var(--font);color:#c2416c}
  .reset-big b{display:block;font:800 56px/1 "M PLUS Rounded 1c",var(--font);color:#ff7aa8;font-variant-numeric:tabular-nums}

  /* ---------- GATE (login etc.) ---------- */
  .gate{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 20% 15%,#e6f2ff 0,transparent 55%),radial-gradient(circle at 85% 80%,#f5e6fa 0,transparent 55%),#fbf9fe}
  .gate.open{display:flex}
  .gate-card{width:100%;max-width:340px;background:#fff;border-radius:28px;padding:28px 22px 22px;box-shadow:0 12px 40px rgba(160,140,210,.28);
    display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
  .gate-logo{height:44px;width:auto;align-self:center}
  .gate-title{font:800 15px/1 "M PLUS Rounded 1c",var(--font);color:var(--sub);letter-spacing:.12em;margin-bottom:6px}
  #gateBody{display:flex;flex-direction:column;gap:10px}
  .g-text{margin:0;font:500 14px/1.7 var(--font);color:var(--ink)}
  .g-title2{margin:0;font:900 18px/1.4 var(--font);color:#d9517a}
  .g-note{margin:0;font:500 12px/1.6 var(--font);color:var(--sub)}
  .g-label{font:700 12px/1.4 var(--font);color:var(--sub);text-align:left;margin:4px 2px -4px}
  .g-input{height:46px;border:0;background:var(--soft);border-radius:14px;padding:0 14px;font:700 15px/1 var(--font);color:var(--ink);
    -webkit-user-select:text;user-select:text;text-align:center}
  .g-input:focus{outline:2px solid var(--sky)}
  .g-btn{height:48px;border:0;border-radius:999px;background:var(--soft);color:var(--ink);font:700 15px/1 var(--font);cursor:pointer}
  .g-btn.primary{background:var(--grad)}
  .g-btn:disabled{opacity:.5}

  /* ---------- WARNING ---------- */
  .warn{position:absolute;inset:0;z-index:15;background:rgba(58,53,80,.35);display:none;align-items:center;justify-content:center;padding:20px}
  .warn.open{display:flex}
  .warn-card{background:#fff;border-radius:26px;width:100%;max-width:340px;padding:22px 20px 18px;box-shadow:0 12px 40px rgba(120,100,180,.3)}
  .warn-card h3{margin:0 0 4px;font:900 17px/1.4 var(--font);color:#d9517a}
  .warn-date{font:700 11px/1 var(--font);color:var(--sub)}
  .warn-msg{margin:14px 0 18px;font:500 15px/1.7 var(--font);white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:16px;padding:12px 14px}
  .warn-card button{width:100%;height:48px;border:0;border-radius:999px;background:var(--grad);font:700 15px/1 var(--font);color:var(--ink);cursor:pointer}

  /* ---------- STAFF ---------- */
  .side .sqbtn.staff-btn{display:none}
  .staff{position:absolute;left:calc(var(--safe-l) + 8px);right:calc(var(--safe-r) + 8px);bottom:calc(var(--safe-b) + 8px);z-index:6;
    max-width:620px;margin:0 auto;background:#fff;border-radius:26px;box-shadow:0 8px 30px rgba(160,140,210,.32);border:2px solid #f3edf9;
    display:none;flex-direction:column;max-height:min(56vh,480px)}
  .staff.open{display:flex}
  .st-top{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
  .st-top b{font:800 13px/1 "M PLUS Rounded 1c",var(--font);padding:0 6px;color:#8a6ad8}
  .st-tab{border:0;background:var(--soft);border-radius:999px;height:34px;padding:0 14px;font:700 13px/1 var(--font);color:var(--ink);cursor:pointer}
  .st-tab.on{background:var(--grad)}
  .st-x{margin-left:auto;border:0;width:34px;height:34px;border-radius:50%;background:var(--soft);font:700 16px/1 var(--font);cursor:pointer;color:var(--ink)}
  #staffBody{overflow:auto;padding:4px 12px 14px;display:flex;flex-direction:column;gap:8px}
  .st-hint{margin:10px 4px;font:500 13px/1.6 var(--font);color:var(--sub)}
  .st-card{display:flex;flex-direction:column;gap:10px}
  .st-head{display:flex;align-items:center;gap:10px}
  .st-head .av{margin:0;width:34px;height:34px;font-size:14px;border-color:#fff}
  .st-name{font:900 16px/1.3 var(--font);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-badge{font:700 11px/1 var(--font);padding:5px 8px;border-radius:999px;background:var(--soft)}
  .st-badge.ban{background:#ffd3e4;color:#c2416c}
  .st-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;background:var(--soft);border-radius:16px;padding:12px 14px}
  .st-dl dt{font:700 12px/1.5 var(--font);color:var(--sub)}
  .st-dl dd{margin:0;font:700 13px/1.5 var(--font);word-break:break-all}
  .st-acts{display:flex;flex-wrap:wrap;gap:6px}
  .st-acts .g-btn{height:40px;padding:0 14px;font-size:13px;flex:1 1 auto}
  .g-btn.danger{background:#ffe1eb;color:#c2416c}
  .g-btn.link{all:unset;cursor:pointer;font:700 13px/1 var(--font);color:#7a6ad0;padding:6px 2px}
  .st-row{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:14px}
  .st-row:hover{background:var(--soft)}
  .st-row .av{margin:0;border-color:#fff}
  .st-row-main{flex:1;min-width:0}
  .st-row-name{font:700 14px/1.3 var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-row-sub{font:500 11.5px/1.4 var(--font);color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-log{padding:9px 6px;border-bottom:1px solid var(--line)}
  .st-log-time{font:700 11px/1.4 var(--font);color:var(--sub)}
  .st-log-main{font:700 13px/1.5 var(--font)}
  .st-log-detail{font:500 12px/1.5 var(--font);color:var(--sub);word-break:break-word}
  .dlg{position:absolute;inset:0;z-index:16;background:rgba(58,53,80,.3);display:none;align-items:center;justify-content:center;padding:20px}
  .dlg.open{display:flex}
  .dlg-card{background:#fff;border-radius:24px;width:100%;max-width:340px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(120,100,180,.3)}
  .dlg-card h3{margin:0;font:900 16px/1.4 var(--font)}
  #dlgBody{display:flex;flex-direction:column;gap:10px}
  .d-text{margin:0;font:500 13px/1.6 var(--font);color:var(--sub)}
  .d-input{border:0;background:var(--soft);border-radius:14px;padding:12px 14px;font:500 14px/1.6 var(--font);color:var(--ink);resize:none;
    -webkit-user-select:text;user-select:text;font-family:var(--font)}
  .d-input:focus{outline:2px solid var(--sky)}
  .d-radios{display:flex;gap:6px}
  .d-radio{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:999px;background:var(--soft);font:700 13px/1 var(--font);cursor:pointer}
  .d-radio:has(input:checked){background:var(--grad)}
  .d-radio input{accent-color:#8a6ad8}
  .d-check{display:flex;align-items:center;gap:8px;font:700 13px/1.4 var(--font)}
  .dlg-acts{display:flex;gap:8px}
  .dlg-acts button{flex:1;height:46px;border-radius:999px;border:0;font:700 14px/1 var(--font);cursor:pointer;background:var(--soft);color:var(--ink)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
/* ============ CONFIG ============ */
const COLORS = ["#3a3550","#ff7aa8","#ffb3cf","#ff9f80","#ffd36e","#8ee0b4","#7cc8ff","#a9d3ff","#b39dff","#e3c4ee","#c9a98c","#b8b3c8"];
const AV_COLORS = ["#ffd3e4","#cdf1df","#fff1bd","#d9ebff","#e9dcff","#ffe0d1"];
const MAX_PTS = 2500;            // points per stroke before splitting
const MIN_SCALE = 0.02, MAX_SCALE = 8;
// the canvas is a huge board with an edge: 12000 x 12000 canvas px around the origin
const B = { x0:-6000, y0:-6000, x1:6000, y1:6000 };
const EDGE_A = "#99ccff", EDGE_B = "#e7c8ef";   // Linear sky -> lavender
const OUTSIDE = "#f6f2fb";
const SECTION = 1000;   // one grid section = 1000 canvas px  (12 x 12 sections)
const COLS = "ABCDEFGHIJKL";
let gridOn = false, mapOn = true;
try{ gridOn = localStorage.getItem("drawroom.grid")==="1"; mapOn = localStorage.getItem("drawroom.map")!=="0"; }catch(_){}
function sectionName(wx,wy){
  const c = Math.min(11,Math.max(0,Math.floor((wx-B.x0)/SECTION))), r = Math.min(11,Math.max(0,Math.floor((wy-B.y0)/SECTION)));
  return COLS[c] + "-" + (r+1);
}
const inBounds = (x,y) => x>=B.x0 && x<=B.x1 && y>=B.y0 && y<=B.y1;
const clampX = x => Math.min(B.x1, Math.max(B.x0, x));
const clampY = y => Math.min(B.y1, Math.max(B.y0, y));

/* ============ STATE ============ */
const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const view = { x: 0, y: 0, s: 1 };
let tool = "pen", color = COLORS[0], size = 8;

const tabId = rid(8);
let myUid = null;
let api = null;                     // backend: Supabase, or the in-browser demo
let me = null;                      // { id, name, role, iriam }
let canWrite = false, isAdmin = false;

const strokes = new Map();          // id -> saved stroke {id,c,w,p,t,by}
let ordered = [];                   // saved strokes, oldest first
const pathCache = new Map();        // stroke id -> {path, box}
const live = new Map();             // peer live strokes: sid -> {c,w,p,done,at}
let cur = null;                     // my in-progress stroke
const undoStack = [];               // {type:"add", id} | {type:"rub", trash:[ids], added:[ids]}
let erasing = null;                 // eraser rub in progress
let staffMode = false;              // staff: tap lines to see who drew them
let focusUser = null;               // staff: only this person's lines at full strength
let picked = null;                  // staff: the line picked on the canvas

let needDraw = true;

/* ============ UTIL ============ */
function rid(n){ const a="abcdefghijklmnopqrstuvwxyz0123456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const b of r) s+=a[b%36]; return s; }
function strokeId(){ return Date.now().toString(36).padStart(9,"0") + "-" + rid(5); }
const r1 = v => Math.round(v*10)/10;
function toast(msg, ms=2200){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),ms); }
function setStatus(msg){ const s=document.getElementById("status"); if(msg){ s.textContent=msg; s.classList.add("show"); } else s.classList.remove("show"); }
function hashColor(str){ let h=0; for(const ch of String(str)) h=(h*31+ch.charCodeAt(0))|0; return AV_COLORS[Math.abs(h)%AV_COLORS.length]; }
const NAME_MAX = 20;
const cleanName = v => typeof v === "string" ? v.replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, NAME_MAX) : "";
const isHex = c => typeof c==="string" && /^#[0-9a-fA-F]{6}$/.test(c);

function validStroke(s){
  if(!s || typeof s!=="object") return null;
  if(typeof s.id!=="string" || s.id.length>40) return null;
  if(!isHex(s.c)) return null;
  const w = Number(s.w); if(!(w>=0.5 && w<=200)) return null;
  if(!Array.isArray(s.p) || s.p.length<2 || s.p.length%2) return null;
  for(let i=0;i<s.p.length;i++){ if(typeof s.p[i]!=="number" || !isFinite(s.p[i])) return null; }
  return { id:s.id, c:s.c, w, p:s.p, t:Number(s.t)||0, by: typeof s.by==="string"? s.by : null };
}

/* ============ CANVAS / VIEW ============ */
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  needDraw = true;
}
window.addEventListener("resize", resize);
resize();
view.x = W/2; view.y = H/2;   // world origin at screen center

const toWorld = (sx,sy) => [(sx-view.x)/view.s, (sy-view.y)/view.s];
const toScreen = (wx,wy) => [wx*view.s+view.x, wy*view.s+view.y];

function buildPath(p){
  const path = new Path2D();
  const n = p.length/2;
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  for(let i=0;i<p.length;i+=2){ const x=p[i],y=p[i+1]; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }
  path.moveTo(p[0],p[1]);
  if(n===1){ path.lineTo(p[0]+0.01,p[1]); }
  else if(n===2){ path.lineTo(p[2],p[3]); }
  else{
    for(let i=2;i<p.length-2;i+=2){
      const mx=(p[i]+p[i+2])/2, my=(p[i+1]+p[i+3])/2;
      path.quadraticCurveTo(p[i],p[i+1],mx,my);
    }
    path.lineTo(p[p.length-2],p[p.length-1]);
  }
  return { path, box:[minx,miny,maxx,maxy] };
}
function cached(s){
  let c = pathCache.get(s.id);
  if(!c){ c = buildPath(s.p); pathCache.set(s.id,c); }
  return c;
}

function drawGridLines(){
  const [bx0,by0] = toScreen(B.x0,B.y0), [bx1,by1] = toScreen(B.x1,B.y1);
  const gx0=Math.max(0,bx0), gy0=Math.max(0,by0), gx1=Math.min(W,bx1), gy1=Math.min(H,by1);
  if(gx1<=gx0 || gy1<=gy0) return;
  const [wx0,wy0] = toWorld(gx0,gy0), [wx1,wy1] = toWorld(gx1,gy1);
  const lines = (step, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    for(let x=Math.ceil(wx0/step)*step; x<=wx1; x+=step){ const sx=Math.round(x*view.s+view.x)+.5; ctx.moveTo(sx,gy0); ctx.lineTo(sx,gy1); }
    for(let y=Math.ceil(wy0/step)*step; y<=wy1; y+=step){ const sy=Math.round(y*view.s+view.y)+.5; ctx.moveTo(gx0,sy); ctx.lineTo(gx1,sy); }
    ctx.stroke();
  };
  const minor = [50,100,250,500].find(st => st*view.s >= 26);
  if(minor) lines(minor, "#f1eaf7", 1);
  if(SECTION*view.s >= 5) lines(SECTION, "#d9cdea", SECTION*view.s>60 ? 1.6 : 1);
}
function drawSectionLabels(){
  // a label for every section on screen, kept inside the visible part of its cell
  const cell = SECTION*view.s;
  if(cell < 22) return;
  const compact = cell < 64;   // far zoomed: small centered names, no pills
  const top = 64, pad = 8;
  const [wx0,wy0] = toWorld(0,top), [wx1,wy1] = toWorld(W,H);
  const c0=Math.max(0,Math.floor((wx0-B.x0)/SECTION)), c1=Math.min(11,Math.floor((wx1-B.x0)/SECTION));
  const r0=Math.max(0,Math.floor((wy0-B.y0)/SECTION)), r1=Math.min(11,Math.floor((wy1-B.y0)/SECTION));
  ctx.font = '700 11px "Zen Maru Gothic","M PLUS Rounded 1c",sans-serif';
  ctx.textBaseline = "middle";
  for(let c=c0;c<=c1;c++) for(let r=r0;r<=r1;r++){
    const [x0,y0] = toScreen(B.x0+c*SECTION, B.y0+r*SECTION), [x1,y1] = toScreen(B.x0+(c+1)*SECTION, B.y0+(r+1)*SECTION);
    const lx = Math.max(x0,0)+pad, ly = Math.max(y0,top)+pad;
    const txt = COLS[c]+"-"+(r+1);
    if(compact){
      ctx.font = '700 '+(cell<36?9:10)+'px "Zen Maru Gothic","M PLUS Rounded 1c",sans-serif';
      ctx.textAlign = "center"; ctx.fillStyle = "rgba(140,134,163,.75)";
      ctx.fillText(txt, (x0+x1)/2, (y0+y1)/2);
      ctx.textAlign = "start";
      continue;
    }
    const tw = ctx.measureText(txt).width + 14;
    if(lx+tw > x1-2 || ly+20 > y1-2) continue;
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(lx,ly,tw,20,10); else ctx.rect(lx,ly,tw,20); ctx.fill();
    ctx.strokeStyle = "#e3d8f0"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#8c86a3"; ctx.fillText(txt, lx+7, ly+10.5);
  }
}
function drawGrid(){
  if(gridOn){ drawGridLines(); return; }
  const step0 = 48;
  let step = step0*view.s;
  while(step<22) step*=2;
  while(step>110) step/=2;
  const ox = ((view.x % step)+step)%step, oy = ((view.y % step)+step)%step;
  ctx.fillStyle = "#eadff2";
  const r = 1.1;
  const [bx0,by0] = toScreen(B.x0,B.y0), [bx1,by1] = toScreen(B.x1,B.y1);
  const gx0=Math.max(0,bx0), gy0=Math.max(0,by0), gx1=Math.min(W,bx1), gy1=Math.min(H,by1);
  const sx = ox + Math.ceil((gx0-ox)/step)*step, sy = oy + Math.ceil((gy0-oy)/step)*step;
  for(let x=sx; x<gx1; x+=step){ for(let y=sy; y<gy1; y+=step){ ctx.fillRect(x-r/2,y-r/2,r,r); } }
  // origin cross (trim mark)
  const [cx,cy] = toScreen(0,0);
  if(cx>-20 && cx<W+20 && cy>-20 && cy<H+20){
    ctx.strokeStyle="#dccdea"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(cx-10,cy); ctx.lineTo(cx+10,cy); ctx.moveTo(cx,cy-10); ctx.lineTo(cx,cy+10); ctx.stroke();
  }
}

function boardRadius(){ return Math.min(28, (B.x1-B.x0)*view.s/6); }
function boardPath(c, inset){
  const [x0,y0] = toScreen(B.x0,B.y0), [x1,y1] = toScreen(B.x1,B.y1);
  const r = Math.max(0, boardRadius() - inset);
  c.beginPath();
  if(c.roundRect) c.roundRect(x0+inset,y0+inset,(x1-x0)-inset*2,(y1-y0)-inset*2,r);
  else c.rect(x0+inset,y0+inset,(x1-x0)-inset*2,(y1-y0)-inset*2);
}
function drawEdge(){
  // gradient frame along the canvas edge, constant thickness on screen
  const [x0,y0] = toScreen(B.x0,B.y0), [x1,y1] = toScreen(B.x1,B.y1);
  if(x1<-40 || x0>W+40 || y1<-40 || y0>H+40) return;
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0, EDGE_A); g.addColorStop(0.5, "#c6c9f7"); g.addColorStop(1, EDGE_B);
  // soft outer glow
  ctx.lineWidth = 22; ctx.strokeStyle = g; ctx.globalAlpha = 0.18; boardPath(ctx,-11); ctx.stroke();
  ctx.globalAlpha = 1;
  // two-tone band so the gradient reads even when zoomed in on one edge
  const g2 = ctx.createLinearGradient(x0,y0,x1,y1);
  g2.addColorStop(0, EDGE_B); g2.addColorStop(0.5, "#cfe6ff"); g2.addColorStop(1, EDGE_A);
  ctx.lineWidth = 12; ctx.strokeStyle = g2; boardPath(ctx,-6); ctx.stroke();
  ctx.lineWidth = 6; ctx.strokeStyle = g; boardPath(ctx,-3); ctx.stroke();
  // thin white highlight inside
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.9)"; boardPath(ctx,-6.2); ctx.stroke();
  ctx.restore();
}
function clipBoard(){
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0); boardPath(ctx,0); ctx.restore(); ctx.clip();
}
function clampView(){
  const m = 70;
  const [x0,y0] = toScreen(B.x0,B.y0), [x1,y1] = toScreen(B.x1,B.y1);
  if(x1 < m) view.x += m-x1; else if(x0 > W-m) view.x -= x0-(W-m);
  if(y1 < m) view.y += m-y1; else if(y0 > H-m) view.y -= y0-(H-m);
}
function strokeIt(c,w,path){
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(path);
}

function draw(){
  needDraw = false;
  clampView();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // committed strokes are rendered once into a cached layer; only live ink is redrawn per frame
  if(!baseValid || baseView.x!==view.x || baseView.y!==view.y || baseView.s!==view.s || base.width!==cv.width || base.height!==cv.height){
    renderBase();
  }

function rebuildOrder(){

const pointers = new Map();   // id -> {x,y}
let gesture = null;           // {kind:'pan'|'pinch', ...}
let penStartAt = 0;

function localXY(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }

cv.addEventListener("pointerdown", e=>{
  closeMenu();
  if(picker.classList.contains("open")){ saveRecent(color); closePicker(); }
  cv.setPointerCapture(e.pointerId);
  const [x,y] = localXY(e);
  pointers.set(e.pointerId,{x,y});
  if(pointers.size===2){
    if(erasing) endErase();
    // second finger: cancel a just-started stroke, else commit it
    if(cur){ if(performance.now()-penStartAt<220 || cur.p.length<=4) { endInk.sid=cur.id; cur=null; endInk(true); needDraw=true; } else finishStroke(); }
    startPinch();
    return;
  }
  if(pointers.size>2) return;
  if(staffMode && tool!=="pan" && e.button!==1 && e.button!==2){ pickAt(x,y); return; }
  const wantPan = tool==="pan" || e.button===1 || e.button===2;
  if(wantPan){ gesture={kind:"pan", lx:x, ly:y}; cv.classList.add("panning"); return; }
  if(!canWrite){ toast("このページは閲覧のみです"); return; }
  if(tool==="eraser"){ startErase(x,y); return; }
  startStroke(x,y);
});

cv.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)){ // hover (mouse)
    if(e.pointerType==="mouse"){ const [x,y]=localXY(e); sendPresence(...toWorld(x,y)); }
    return;
  }
  const [x,y] = localXY(e);
  pointers.set(e.pointerId,{x,y});
  if(gesture && gesture.kind==="pinch"){ updatePinch(); return; }
  if(gesture && gesture.kind==="pan"){ view.x += x-gesture.lx; view.y += y-gesture.ly; gesture.lx=x; gesture.ly=y; needDraw=true; return; }
  if(cur){
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const r = cv.getBoundingClientRect();
    for(const ev of evs){ addPoint(ev.clientX-r.left, ev.clientY-r.top); }
  }
  if(erasing) eraseMove(x,y);

function upHandler(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if(gesture && gesture.kind==="pinch"){
    if(pointers.size===1){ const [p]=pointers.values(); gesture={kind:"pan", lx:p.x, ly:p.y, fromPinch:true}; }
    else if(pointers.size===0) gesture=null;
    return;
  }
  if(gesture && gesture.kind==="pan"){ if(pointers.size===0){ gesture=null; cv.classList.remove("panning"); } return; }
  if(cur && pointers.size===0) finishStroke();
  if(erasing && pointers.size===0) endErase();
}
cv.addEventListener("pointerup", upHandler);
cv.addEventListener("pointercancel", upHandler);
cv.addEventListener("contextmenu", e=>e.preventDefault());

function startPinch(){
  const [a,b] = [...pointers.values()];
  const [wx,wy] = toWorld((a.x+b.x)/2,(a.y+b.y)/2);
  gesture = { kind:"pinch", d0: Math.hypot(a.x-b.x,a.y-b.y)||1, s0: view.s, wx, wy };
}
function updatePinch(){
  const pts=[...pointers.values()]; if(pts.length<2) return;
  const [a,b]=pts;
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
  view.s = Math.min(MAX_SCALE,Math.max(MIN_SCALE, gesture.s0*d/gesture.d0));
  view.x = mx - gesture.wx*view.s; view.y = my - gesture.wy*view.s;

}

cv.addEventListener("wheel", e=>{
  e.preventDefault();
  const [x,y]=localXY(e);
  if(e.ctrlKey || e.metaKey){
    zoomAt(x,y, Math.exp(-e.deltaY*0.01));
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY; needDraw=true;
  }
},{passive:false});
function zoomAt(x,y,f){
  const [wx,wy]=toWorld(x,y);
  view.s = Math.min(MAX_SCALE,Math.max(MIN_SCALE,view.s*f));
  view.x = x-wx*view.s; view.y = y-wy*view.s; needDraw=true;
}

/* ============ STROKES ============ */
function startStroke(x,y){
  const [wx,wy]=toWorld(x,y);
  if(!inBounds(wx,wy)){ toast("キャンバスの外です"); return; }
  // pen width is fixed on the canvas, so on-screen thickness follows the zoom
  const w = size;
  cur = { id: strokeId(), c: color, w: r1(Math.max(0.5,Math.min(200,w))), p:[r1(wx),r1(wy)], t: Date.now(), by: myUid };
  cur.sent = 0;
  penStartAt = performance.now();
  startInk();
  needDraw = true;
  sendPresence(wx,wy,true);
}
function addPoint(x,y){
  let [wx,wy]=toWorld(x,y);
  wx = clampX(wx); wy = clampY(wy);
  const p=cur.p, lx=p[p.length-2], ly=p[p.length-1];
  if(Math.hypot(wx-lx,wy-ly) < 1.6/view.s) return;
  p.push(r1(wx),r1(wy));
  needDraw = true;
  sendPresence(wx,wy,true);
  if(p.length/2 >= MAX_PTS){
    // split long stroke seamlessly
    const last=[p[p.length-2],p[p.length-1]];
    const keep={c:cur.c,w:cur.w};
    finishStroke(true);
    cur = { id: strokeId(), c:keep.c, w:keep.w, p:[...last], t:Date.now(), by:myUid, sent:0 };
    startInk();
  }
}
function finishStroke(silentPresence){
  if(!cur) return;
  const s = { id:cur.id, c:cur.c, w:cur.w, p:cur.p.slice(), t:cur.t, by:myUid };
  flushInk(true);
  cur = null;
  strokes.set(s.id, s);
  undoStack.push({ type:"add", id:s.id });
  if(undoStack.length>200) undoStack.shift();
  rebuildOrder();
  if(!silentPresence) sendPresence(s.p[s.p.length-2], s.p[s.p.length-1], false);
  api.addStroke(s).catch(err=>{
    strokes.delete(s.id); rebuildOrder();
    failed(err, "線を保存できませんでした");
  });
}

/* ---- eraser: rubs out only the part it touches, on lines I drew (staff: any line) ---- */
const ERASE_R = { 3: 9, 8: 15, 22: 28 };   // radius on screen, px
const isMine = s => !!myUid && s.by === myUid;
const canErase = s => isMine(s) || isAdmin;
function startErase(x,y){
  const [wx,wy] = toWorld(x,y);
  // removed: saved lines touched in this rub (id -> line); added: pieces left (id -> piece with src = its saved line)
  erasing = { pos:[x,y], last:[wx,wy], warned:false, removed:new Map(), added:new Map() };
  eraseAround(wx,wy);
  sendPresence(wx,wy,true);
  needDraw = true;
}
function eraseMove(x,y){
  const [wx,wy] = toWorld(x,y);
  const [lx,ly] = erasing.last;
  const r = (ERASE_R[size]||15)/view.s;
  const n = Math.max(1, Math.ceil(Math.hypot(wx-lx,wy-ly)/(r*0.5)));
  for(let i=1;i<=n;i++) eraseAround(lx+(wx-lx)*i/n, ly+(wy-ly)*i/n);
  erasing.last = [wx,wy]; erasing.pos = [x,y];
  sendPresence(wx,wy,true);
  needDraw = true;
}
function endErase(){
  if(!erasing) return;
  const e = erasing; erasing = null; needDraw = true;
  sendPresence(e.last[0], e.last[1], false);
  if(!e.removed.size) return;
  // save the whole rub at once
  const removedIds = [...e.removed.keys()];
  const pieces = [...e.added.values()];
  api.eraseStrokes(removedIds, pieces.map(p => ({ id:p.id, p:p.p, src:p.src }))).then(()=>{
    undoStack.push({ type:"rub", trash: removedIds, added: pieces.map(p=>p.id) });
    if(undoStack.length>200) undoStack.shift();
  }).catch(err=>{
    for(const p of pieces) strokes.delete(p.id);
    for(const s of e.removed.values()) strokes.set(s.id, s);
    rebuildOrder();
    failed(err, "消せませんでした");
  });
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
  let t = L ? ((px-ax)*dx+(py-ay)*dy)/L : 0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
// cut the part of a line within reach of the eraser; returns the pieces left, or null if untouched
function cutStroke(s, cx, cy, r){
  const p = s.p, T = r + s.w/2, step = Math.max(0.4, Math.min(r*0.3, T*0.3));
  const pts = [];
  if(p.length===2){ pts.push(p[0],p[1]); }
  else for(let i=0;i<p.length-2;i+=2){
    const ax=p[i], ay=p[i+1], bx=p[i+2], by=p[i+3];
    if(i===0) pts.push(ax,ay);
    if(segDist(cx,cy,ax,ay,bx,by) < T + step){
      const k = Math.max(1, Math.ceil(Math.hypot(bx-ax,by-ay)/step));
      for(let j=1;j<k;j++) pts.push(ax+(bx-ax)*j/k, ay+(by-ay)*j/k);
    }
    pts.push(bx,by);
  }
  let hit=false; const keep=[];
  for(let i=0;i<pts.length;i+=2){ const inside = Math.hypot(pts[i]-cx,pts[i+1]-cy) < T; keep.push(!inside); if(inside) hit=true; }
  if(!hit) return null;
  const pieces=[]; let run=[];
  const flush=()=>{ if(run.length>=4) pieces.push(run.map(r1)); run=[]; };
  for(let k=0;k<keep.length;k++){ if(keep[k]) run.push(pts[2*k],pts[2*k+1]); else flush(); }
  flush();
  return pieces.map(pp => ({ id: strokeId(), c:s.c, w:s.w, p:pp, t:s.t, by:s.by }));
}
function touches(s, wx, wy, pad){
  if(s.p.length===2) return Math.hypot(wx-s.p[0],wy-s.p[1]) < pad;
  for(let k=0;k<s.p.length-2;k+=2) if(segDist(wx,wy,s.p[k],s.p[k+1],s.p[k+2],s.p[k+3]) < pad) return true;
  return false;
}
function eraseAround(wx,wy){
  const r = (ERASE_R[size]||15)/view.s;
  let changed = false, others = false;
  for(let i=ordered.length-1;i>=0;i--){
    const s = ordered[i], b = cached(s).box, pad = r + s.w/2;
    if(wx < b[0]-pad || wx > b[2]+pad || wy < b[1]-pad || wy > b[3]+pad) continue;
    if(!canErase(s)){ if(touches(s,wx,wy,pad)) others = true; continue; }
    const pieces = cutStroke(s, wx, wy, r);
    if(!pieces) continue;
    // a piece cut again in the same rub keeps the saved line it came from
    let src;
    if(erasing.added.has(s.id)){ src = erasing.added.get(s.id).src; erasing.added.delete(s.id); }
    else { src = s.id; erasing.removed.set(s.id, s); }
    strokes.delete(s.id); pathCache.delete(s.id);
    for(const pc of pieces){ pc.src = src; strokes.set(pc.id, pc); erasing.added.set(pc.id, pc); }
    changed = true;
  }
  if(changed) rebuildOrder();
  else if(others && !erasing.warned){ erasing.warned = true; toast("ほかの人の線は消せません"); }
}

function undo(){
  const u = undoStack.pop();
  if(!u){ toast("もどせる操作がありません"); return; }
  if(u.type === "add"){
    const s = strokes.get(u.id);
    if(!s){ undo(); return; }                    // already gone (erased or removed by staff)
    strokes.delete(u.id); rebuildOrder();
    api.deleteStroke(u.id).catch(err=>{ strokes.set(s.id, s); rebuildOrder(); failed(err, "もどせませんでした"); });
    return;
  }
  if(u.type === "rub"){
    api.restoreStrokes(u.trash, u.added).then(rows=>{
      for(const id of u.added){ strokes.delete(id); pathCache.delete(id); }
      for(const s of rows) strokes.set(s.id, s);
      rebuildOrder();
    }).catch(err=>failed(err, "もどせませんでした"));
  }
}

/* ---- realtime ink (room) ---- */
let inkTimer = null;
function startInk(){
  if(!api) return;
  clearInterval(inkTimer);
  inkTimer = setInterval(()=>flushInk(false), 150);
}
function flushInk(final){
  if(!api || !cur){ if(final) clearInterval(inkTimer); return; }
  const from = cur.sent;
  const pts = cur.p.slice(from);
  if(pts.length || final){
    // chunk to stay well under 4KiB
    for(let i=0;i<pts.length || (i===0 && final);i+=300){
      const chunk = pts.slice(i,i+300);
      const isLast = i+300>=pts.length;
      api.sendInk({ sid:cur.id, c:cur.c, w:cur.w, i:from+i, p:chunk, end: final && isLast });
      if(!pts.length) break;
    }
    cur.sent = cur.p.length;
  }
  if(final) clearInterval(inkTimer);
}
function endInk(cancel){
  clearInterval(inkTimer);
  if(cancel && api && endInk.sid) api.sendInk({ sid:endInk.sid, c:"#111111", w:1, i:0, p:[], end:true, x:1 });
}

function onInk(msg){
  if(msg.sameTab) return;
  const d = msg.data; if(!d || typeof d!=="object") return;
  if(typeof d.sid!=="string" || d.sid.length>40 || !isHex(d.c)) return;
  const w = Number(d.w); if(!(w>=0.5&&w<=200)) return;
  if(!Array.isArray(d.p) || d.p.length%2) return;
  for(const v of d.p) if(typeof v!=="number"||!isFinite(v)) return;
  if(pathCache.has(d.sid)) return; // already committed
  if(d.x){ live.delete(d.sid); needDraw=true; return; } // cancelled stroke
  let l = live.get(d.sid);
  if(!l){ l={c:d.c,w,p:[],at:Date.now(),peer:msg.peer}; live.set(d.sid,l); }
  const i = Number(d.i)||0;
  if(i <= l.p.length){ l.p.length = Math.min(l.p.length, i); l.p.push(...d.p); }
  else { l.p.push(...d.p); }
  l.at = Date.now();
  if(d.end) l.done = true;
  needDraw = true;
}
// clear stale live strokes
setInterval(()=>{
  const now=Date.now(); let ch=false;
  for(const [k,l] of live){
    const limit = 15000;
    if((l.done && now-l.at>limit) || (!l.done && now-l.at>30000)){ live.delete(k); ch=true; }
  }
  if(ch) needDraw=true;
}, 3000);

let lastPres = 0, presPending = null, presLastSent = null;
function sendPresence(wx,wy,drawing){
  if(!api || !me) return;
  presPending = { pos: wx==null? null : [r1(wx),r1(wy)], col: tool==="eraser"? "#b8b3c8" : color, d: !!drawing, uid: myUid, nm: me.name || "" };
  presLastSent = presPending;
  const now=performance.now();
  if(now-lastPres>120){ lastPres=now; api.setPresence(presPending); presPending=null; }
  else { clearTimeout(sendPresence._t); sendPresence._t=setTimeout(()=>{ if(presPending){ api.setPresence(presPending); presPending=null; lastPres=performance.now(); } },130); }
}

const names = new Map();
async function resolveNames(ids){
  if(!api || !ids.length) return;
  try{
    const ps = await api.profiles(ids);

  }catch(_){}
}

let peerList = [];
const tagEls = new Map();
let peopleNow = [];
function renderPeers(){
  const ids = [];
  const byUser = new Map();
  for(const p of peerList){
    if(p.kind!=="viewer") continue;
    const pr = p.presence||{};
    const uid = p.by || (typeof pr.uid==="string" ? pr.uid : null) || p.peer;
    const pnm = cleanName(pr.nm);
    if(uid && pnm) names.set(uid, pnm);          // latest name the person chose
    else if(uid && !names.has(uid) && (p.by||pr.uid)) ids.push(uid);
    const pos = Array.isArray(pr.pos) && pr.pos.length===2 && pr.pos.every(v=>typeof v==="number"&&isFinite(v)) ? pr.pos : null;
    const prev = byUser.get(uid);
    if(!prev) byUser.set(uid,{uid, me:p.isMe, pos, at:p.updatedAt||0});
    else { if(p.isMe) prev.me=true; if(pos && (p.updatedAt||0)>=prev.at){ prev.pos=pos; prev.at=p.updatedAt||0; } }
  }
  const people = [...byUser.values()].sort((a,b)=> (b.me-a.me) || (b.at-a.at));
  peopleNow = people;
  if(ids.length) resolveNames([...new Set(ids)]).then(()=>{ drawAvatars(peopleNow); refreshTags(); renderPeopleList(); });
  drawAvatars(people);
  refreshTags();
  renderPeopleList();
}

function refreshTags(){
  const layer = document.getElementById("peers-layer");
  const alive = new Set();
  for(const p of peerList){
    if(p.isMe || p.kind!=="viewer") continue;
    const pr = p.presence||{};
    if(!Array.isArray(pr.pos) || pr.pos.length!==2 || !pr.pos.every(v=>typeof v==="number"&&isFinite(v))) continue;
    alive.add(p.peer);
    let el = tagEls.get(p.peer);
    if(!el){ el=document.createElement("div"); el.className="peer-tag"; el.innerHTML="<i></i><span></span>"; layer.appendChild(el); tagEls.set(p.peer,el); }
    const uid = p.by || pr.uid || p.peer;
    el.querySelector("span").textContent = names.get(uid) || "Someone";
    el.querySelector("i").style.background = isHex(pr.col)? pr.col : "#111";
    el._pos = pr.pos; el._at = p.updatedAt;
  }
  for(const [k,el] of tagEls) if(!alive.has(k)){ el.remove(); tagEls.delete(k); }
  positionPeerTags();
}
function positionPeerTags(){
  const now = Date.now();
  for(const el of tagEls.values()){
    if(!el._pos) continue;
    const [sx,sy] = toScreen(el._pos[0], el._pos[1]);
    el.style.transform = `translate(${Math.round(sx-5)}px,${Math.round(sy-5)}px)`;
    el.style.opacity = (now-(el._at||now) > 6000) ? "0" : "1";
  }
}

function hsvToHex(h,s,v){
  const f=n=>{ const k=(n+h/60)%6; return v - v*s*Math.max(0,Math.min(k,4-k,1)); };
  return "#"+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("");
}
function hexToHsv(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0; if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0) h+=360; }
  return { h, s: mx? d/mx : 0, v: mx };
}
function pkHexNow(){ return hsvToHex(pk.h,pk.s,pk.v); }
function paintPicker(updateInput){
  const sv=document.getElementById("pkSV");
  sv.style.background="hsl("+pk.h+",100%,50%)";
  const k=document.getElementById("pkSVk");
  k.style.left=(pk.s*100)+"%"; k.style.top=((1-pk.v)*100)+"%"; k.style.background=pkHexNow();
  const hk=document.getElementById("pkHuek");
  hk.style.left=(pk.h/360*100)+"%"; hk.style.background="hsl("+pk.h+",100%,50%)";
  document.getElementById("pkPrev").style.background=pkHexNow();

}
function dragArea(el, fn){
  el.addEventListener("pointerdown", e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const go=ev=>{ const r=el.getBoundingClientRect(); fn(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))); paintPicker(); applyLive(); };
    go(e);
    const mv=ev=>go(ev);
    const up=()=>{ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up); el.removeEventListener("pointercancel",up); };
    el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  });
}

function fit(){
  if(!ordered.length){ home(); toast("まだ何も描かれていません"); return; }
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const s of ordered){ const bx=cached(s).box; a=Math.min(a,bx[0]-s.w); b=Math.min(b,bx[1]-s.w); c=Math.max(c,bx[2]+s.w); d=Math.max(d,bx[3]+s.w); }
  const top=70, bottom=150, side=24;
  const aw=Math.max(50,W-side*2), ah=Math.max(50,H-top-bottom);
  view.s=Math.min(MAX_SCALE,Math.max(MIN_SCALE,Math.min(aw/Math.max(1,c-a), ah/Math.max(1,d-b))));
  view.x = side + (aw-(c-a)*view.s)/2 - a*view.s;
  view.y = top + (ah-(d-b)*view.s)/2 - b*view.s;
  needDraw=true;
}
document.getElementById("fitBtn").onclick=fit;

  closeMenu();
  const top=70,bottom=150,side=24, aw=Math.max(50,W-side*2), ah=Math.max(50,H-top-bottom);
  view.s=Math.max(MIN_SCALE,Math.min(aw/(B.x1-B.x0), ah/(B.y1-B.y0)));
  view.x = side + aw/2 - (B.x0+B.x1)/2*view.s;
  view.y = top + ah/2 - (B.y0+B.y1)/2*view.s;
  needDraw=true;
};

/* ============ ERRORS ============ */
function errText(err){ return String((err && (err.message || err.error_description || err.code)) || err || ""); }
function failed(err, msg){
  const t = errText(err);
  if(/not_member|JWT|jwt|401/.test(t)){ toast("ログインの確認が切れました。読み込み直します", 3000); setTimeout(()=>location.reload(), 2500); return; }
  if(/not_allowed/.test(t)){ toast("ほかの人の線は消せません"); return; }
  if(/not_staff/.test(t)){ toast("運営だけができる操作です"); return; }
  toast(msg, 3000);
}

/* ============ DATES ============ */
function fmtDate(v){
  if(v===null || v===undefined || v==="") return "";
  const d = new Date(typeof v==="number" ? v : String(v));
  if(isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

const gateEl = document.getElementById("gate"), gateBody = document.getElementById("gateBody");
document.getElementById("gateLogo").src = document.querySelector(".brand img").src;
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function btn(text, cls, fn){ const b=el("button", "g-btn "+(cls||""), text); b.onclick=fn; return b; }
function gate(state, info){
  info = info || {};
  gateEl.classList.add("open");
  gateBody.innerHTML = "";
  const add = n => gateBody.appendChild(n);
  const signIn = async ()=>{ try{ await api.signIn(); }catch(err){ toast("ログインを始められませんでした"); } };
  switch(state){
    case "loading":
      add(el("p","g-note", info.text || "読み込み中…")); break;
    case "signed_out":
      add(el("p","g-text","LinearのDiscordサーバーにいるライバーと運営だけが入れます。"));
      add(btn("Discordでログイン","primary",signIn)); break;
    case "expired":
      add(el("p","g-text","確認の期限が切れたので、もう一度ログインしてください。"));
      add(btn("Discordでログイン","primary",signIn)); break;
    case "denied": {
      const why = {
        not_in_guild: "LinearのDiscordサーバーに参加しているアカウントでログインしてください。",
        no_role: "このアカウントには、おえかきルームに入るためのロールがありません。運営に確認してください。"
      }[info.reason] || "ログインを確認できませんでした。時間をおいて、もう一度試してください。";
      add(el("p","g-text",why));
      if(info.reason) add(el("p","g-note","確認コード：" + info.reason + (info.detail ? "（" + info.detail + "）" : "")));
      add(btn("別のアカウントでログイン","primary", async ()=>{ try{ await api.signOut(); }catch(_){} signIn(); }));
      add(btn("ログアウト","", async ()=>{ try{ await api.signOut(); }catch(_){} location.reload(); }));
      break;
    }
    case "need_iriam": {
      add(el("p","g-text","はじめに、表示名とIRIAMのIDを入力してください。"));
      add(el("label","g-label","表示名（みんなに見える名前）"));
      const nameInp = el("input","g-input"); nameInp.placeholder="表示名"; nameInp.maxLength=NAME_MAX; nameInp.autocomplete="off";
      nameInp.value = (info.me && info.me.name) || "";
      add(nameInp);
      add(el("label","g-label","IRIAMのID（運営が本人確認に使います）"));
      const inp = el("input","g-input"); inp.placeholder="IRIAMのID"; inp.maxLength=64; inp.autocomplete="off";
      add(inp);
      const go = btn("はじめる","primary", async ()=>{
        const nm = nameInp.value.trim(), v = inp.value.trim();
        if(!nm){ nameInp.focus(); toast("表示名を入力してください"); return; }
        if(!v){ inp.focus(); toast("IRIAMのIDを入力してください"); return; }
        go.disabled = true;
        try{
          if(!info.me || nm !== info.me.name) await api.setNickname(nm);
          await api.setIriam(v);
          handleStatus(await api.status());
        }
        catch(err){ go.disabled=false; failed(err, "登録できませんでした"); }
      });
      add(go); setTimeout(()=>inp.focus(), 50);
      break;
    }
    case "banned":
      add(el("p","g-title2","利用停止中です"));
      if(info.reason) add(el("p","g-text","理由：" + info.reason));
      add(el("p","g-text", info.until ? ("期限：" + fmtDate(info.until) + " まで") : "期限：なし"));
      add(btn("ログアウト","", async ()=>{ try{ await api.signOut(); }catch(_){} location.reload(); }));
      break;

      add(el("p","g-text","デモモードです（Supabaseにつながっていません）。この端末の中だけで試せます。"));

      add(inp);
      const enterAs = role => async ()=>{ await api.demoLogin(inp.value.trim() || "デモユーザー", role); handleStatus(await api.status()); };

      add(el("p","g-note","別のタブでも開くと、同時に描く動きや警告・BANも試せます。"));
      break;
    }
    default:

/* ============ DAILY RESET (10:30 JST) ============ */
const RESET_H = 10, RESET_M = 30;          // keep in sync with the pg_cron schedule (01:30 UTC)
const JST = 9 * 3600e3;
function nextReset(now){
  const d = new Date(now + JST);
  let t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), RESET_H, RESET_M) - JST;
  if(t <= now) t += 864e5;
  return t;
}
let resetAt = nextReset(Date.now());
function fmtLeft(ms){
  const s = Math.max(0, Math.ceil(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h + ":" + String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0");
}
async function reloadStrokes(){
  try{ const rows = await api.loadStrokes(); strokes.clear(); for(const s of rows) strokes.set(s.id, s); rebuildOrder(); }catch(_){}
}
async function doDailyReset(at){
  if(!me) return;
  strokes.clear(); live.clear(); undoStack.length = 0; picked = null; pathCache.clear();
  rebuildOrder();
  toast("キャンバスがリセットされました。新しい1日です", 3500);
  try{ await api.dailyReset(at); }catch(_){}
  // the server clears on its own schedule; sync again once it has run
  setTimeout(reloadStrokes, 20000);
  setTimeout(reloadStrokes, 70000);
}
function tickReset(){
  const now = Date.now();
  if(now >= resetAt){ const at = resetAt; resetAt = nextReset(now + 1000); doDailyReset(at); }
  const left = resetAt - now;
  document.getElementById("resetLeft").textContent = fmtLeft(left);
  document.getElementById("reset").classList.toggle("soon", left <= 10*60e3);
  const big = me && left <= 60e3;
  document.getElementById("resetBig").classList.toggle("show", !!big);
  if(big) document.getElementById("resetSec").textContent = String(Math.max(0, Math.ceil(left/1000)));
}
tickReset();
setInterval(tickReset, 500);

/* ============ ENTER THE ROOM ============ */
async function enter(st){
  me = st.me; myUid = me.id; isAdmin = me.role === "staff"; canWrite = true;
  names.set(me.id, me.name || "Someone");
  hideGate(); applyWriteState(); setTool("pen");
  api.subscribe({
    onInsert(s){ if(!strokes.has(s.id)){ strokes.set(s.id, s); rebuildOrder(); } },
    onDelete(id){ if(strokes.delete(id)){ pathCache.delete(id); rebuildOrder(); } },
    onInk,
    onPeers(list){ peerList = list; renderPeers(); },
    onConnection(ok){ document.getElementById("liveDot").classList.toggle("off", !ok); },
    onWarning(w){ queueWarnings([w]); },
    async onBanChanged(){
      try{ const s2 = await api.status(); if(s2.state === "banned"){ lockOut(s2); } }catch(_){}
    }
  });
  setStatus("読み込み中…");
  try{
    const rows = await api.loadStrokes();
    for(const s of rows) strokes.set(s.id, s);
    rebuildOrder();
  }catch(err){ failed(err, "絵を読み込めませんでした"); }
  setStatus(null);
  api.setPresence({ pos:null, col:color, d:false, uid: myUid, nm: me.name || "" });
  queueWarnings(st.warnings);
}
function lockOut(st){
  canWrite = false; isAdmin = false; setStaffMode(false); applyWriteState();
  try{ api.unsubscribe(); }catch(_){}
  gate("banned", st);
}

/* ============ BACKEND: SUPABASE ============ */
function createSupabaseApi(cfg){
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" }
  });
  const chk = res => { if(res.error) throw res.error; return res.data; };
  const toStroke = r => validStroke({ id:r.id, c:r.c, w:Number(r.w), p:r.p, t:Number(r.t), by:r.user_id });
  let ch = null, presKey = null, presTimer = null, presLast = 0, presNext = null;
  return {
    mode: "supabase",
    async signIn(){
      const { error } = await sb.auth.signInWithOAuth({ provider:"discord",
        options:{ scopes:"identify guilds.members.read", redirectTo: location.origin + location.pathname } });
      if(error) throw error;
    },
    async signOut(){ await sb.auth.signOut(); },
    async start(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) return { state:"signed_out" };
      if(session.provider_token){
        gate("loading", { text:"Discordのロールを確かめています…" });
        const { data, error } = await sb.functions.invoke("verify-discord", { body:{ provider_token: session.provider_token } });
        if(error){
          let body = null; try{ body = await error.context.json(); }catch(_){}
          return { state:"denied", reason: (body && body.reason) || "error", detail: (body && body.detail) || (!body && error.message) || "" };
        }
        if(!data || !data.ok) return { state:"denied", reason: (data && data.reason) || "error", detail: (data && data.detail) || "" };
      }
      return this.status();
    },
    async status(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) return { state:"signed_out" };
      const st = chk(await sb.rpc("my_status"));
      if(!st || !st.known || !st.active) return { state:"expired" };
      if(st.banned) return { state:"banned", reason: st.ban_reason, until: st.ban_until };
      if(!st.verified) return { state:"expired" };
      const meObj = { id: session.user.id, name: st.display_name, role: st.role, iriam: st.iriam_id };
      if(!st.iriam_id) return { state:"need_iriam", me: meObj };
      return { state:"ready", me: meObj, warnings: st.warnings || [] };
    },
    async setIriam(v){ chk(await sb.rpc("set_my_iriam", { iriam: v })); },
    async setNickname(v){ chk(await sb.rpc("set_my_nickname", { nick: v })); },
    async dailyReset(){ /* done by pg_cron on the server */ },
    async loadStrokes(){
      const out = [];
      for(let from=0;;from+=1000){
        const rows = chk(await sb.from("strokes").select("id,user_id,c,w,p,t").order("t").order("id").range(from, from+999));
        out.push(...rows);
        if(rows.length < 1000) break;
      }
      return out.map(toStroke).filter(Boolean);
    },
    async addStroke(s){ chk(await sb.from("strokes").insert({ id:s.id, c:s.c, w:s.w, p:s.p, t:s.t })); },
    async deleteStroke(id){ chk(await sb.from("strokes").delete().eq("id", id)); },
    async eraseStrokes(removed, pieces){ chk(await sb.rpc("erase_strokes", { removed, pieces })); },
    async restoreStrokes(trashIds, removeIds){
      const rows = chk(await sb.rpc("restore_strokes", { trash_ids: trashIds, remove_ids: removeIds }));
      return (rows || []).map(toStroke).filter(Boolean);
    },
    async ackWarning(id){ chk(await sb.rpc("ack_warning", { wid: id })); },
    async profiles(ids){
      const rows = chk(await sb.from("profiles").select("user_id,display_name").in("user_id", ids));
      const map = {}; for(const r of rows) map[r.user_id] = { name: r.display_name }; return map;
    },
    async subscribe(h){
      const { data:{ session } } = await sb.auth.getSession();
      try{ await sb.realtime.setAuth(session && session.access_token); }catch(_){}
      presKey = myUid + ":" + tabId;
      ch = sb.channel("room:main", { config:{ private:true, broadcast:{ self:false }, presence:{ key: presKey } } });
      ch.on("broadcast", { event:"ink" }, ({ payload }) => h.onInk({ data: payload, sameTab:false, peer: payload && payload.k }));
      ch.on("presence", { event:"sync" }, () => {
        const state = ch.presenceState(), list = [];
        for(const [key, metas] of Object.entries(state)){
          const m = metas[metas.length-1] || {};
          list.push({ peer:key, by: typeof m.uid==="string" ? m.uid : null, isMe: m.uid===myUid, sameTab: key===presKey,
            kind:"viewer", presence:m, updatedAt: Number(m.at) || Date.now() });
        }
        h.onPeers(list);
      });
      ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"strokes" }, p => { const s = toStroke(p.new); if(s) h.onInsert(s); });
      ch.on("postgres_changes", { event:"DELETE", schema:"public", table:"strokes" }, p => { if(p.old && p.old.id) h.onDelete(p.old.id); });
      ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"warnings", filter:"user_id=eq."+myUid }, p => h.onWarning(p.new));
      ch.on("postgres_changes", { event:"*", schema:"public", table:"bans", filter:"user_id=eq."+myUid }, () => h.onBanChanged());
      ch.subscribe(status => {
        if(status === "SUBSCRIBED"){ h.onConnection(true); if(presNext) ch.track(presNext); }
        else if(status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") h.onConnection(false);
      });
    },
    unsubscribe(){ if(ch){ sb.removeChannel(ch); ch = null; } },
    sendInk(data){ if(!ch) return Promise.resolve(); return ch.send({ type:"broadcast", event:"ink", payload:{ ...data, k: presKey } }).catch(()=>{}); },
    setPresence(meta){
      presNext = { ...meta, uid: myUid, at: Date.now() };
      const go = ()=>{ presLast = Date.now(); if(ch) ch.track(presNext).catch(()=>{}); };
      clearTimeout(presTimer);
      if(Date.now() - presLast > 300) go(); else presTimer = setTimeout(go, 320);
    },
    // staff
    async members(){
      const rows = chk(await sb.rpc("staff_members")) || [];
      return rows.map(r => ({ ...r, stroke_count: Number(r.stroke_count)||0, warning_count: Number(r.warning_count)||0 }));
    },
    async warn(uid, msg){ chk(await sb.rpc("staff_warn", { target: uid, msg })); },
    async ban(uid, days, reason){ chk(await sb.rpc("staff_ban", { target: uid, days, reason })); },
    async unban(uid){ chk(await sb.rpc("staff_unban", { target: uid })); },
    async deleteUserStrokes(uid){ return chk(await sb.rpc("staff_delete_user_strokes", { target: uid })); },
    async clearAll(){ return chk(await sb.rpc("staff_clear_all")); },
    async setIriamFor(uid, v){ chk(await sb.rpc("staff_set_iriam", { target: uid, iriam: v })); },
    async modLog(){ return chk(await sb.from("mod_log").select("*").order("created_at", { ascending:false }).limit(100)); }
  };
}

    const d = { v:1, seq:1, members:{}, strokes:[], trash:[], bans:{}, warnings:[], log:[] };
    d.members["demo-mio"]  = { user_id:"demo-mio",  display_name:"みお（デモ）", discord_id:"100000000000000001", iriam_id:"mio_demo",  role:"liver", active:true };
    d.members["demo-riku"] = { user_id:"demo-riku", display_name:"りく（デモ）", discord_id:"100000000000000002", iriam_id:"riku_demo", role:"liver", active:true };
    const wave = (x0, y0, c, by, n) => { const p=[]; for(let i=0;i<=40;i++) p.push(x0+i*12, y0+Math.round(Math.sin(i/4)*30)); return { id:"demo-"+n, c, w:10, p, t:n, by }; };
    d.strokes.push(wave(-260,-150,"#ff7aa8","demo-mio",1), wave(-260,-50,"#7cc8ff","demo-riku",2), wave(-260,50,"#b39dff","demo-mio",3));
    return d;
  }
  const read = () => { if(memStore) return memStore; try{ const d = JSON.parse(localStorage.getItem(KEY)||"null"); if(d && d.v===1) return d; }catch(_){} memStore = seed(); return memStore; };
  const save = d => { try{ localStorage.setItem(KEY, JSON.stringify(d)); memStore = null; }catch(_){ memStore = d; } };
  const post = m => { try{ bc && bc.postMessage(m); }catch(_){} };
  let meRec = null; try{ meRec = JSON.parse(sessionStorage.getItem(SKEY) || "null"); }catch(_){}
  const activeBan = (d, id) => { const b = d.bans[id]; return b && (b.until === null || b.until > Date.now()) ? b : null; };
  const deny = code => Promise.reject({ message: code });
  const isStaff = () => { const d = read(); return meRec && d.members[meRec.id] && d.members[meRec.id].role === "staff" && !activeBan(d, meRec.id); };
  const log = (d, action, target, detail) => d.log.unshift({ id: d.seq++, actor: meRec.id, action, target, detail: detail || null, created_at: new Date().toISOString() });
  let h = null, myMeta = null, myAt = 0, hb = null;
  const peers = new Map();
  const key = () => meRec.id + ":" + tabId;
  const emitPeers = () => {
    if(!h) return;
    const list = [];
    if(myMeta) list.push({ peer:key(), by:meRec.id, isMe:true, sameTab:true, kind:"viewer", presence:myMeta, updatedAt:myAt });
    for(const [k, v] of peers) list.push({ peer:k, by:v.meta.uid, isMe: v.meta.uid===meRec.id, sameTab:false, kind:"viewer", presence:v.meta, updatedAt:v.at });
    h.onPeers(list);
  };
  return {
    mode: "demo",
    async signIn(){},
    async signOut(){ post({ type:"leave", key: meRec && key() }); try{ sessionStorage.removeItem(SKEY); }catch(_){} meRec = null; },
    async demoLogin(name, role){
      meRec = { id: "demo-" + rid(6) };
      try{ sessionStorage.setItem(SKEY, JSON.stringify(meRec)); }catch(_){}
      const d = read();
      d.members[meRec.id] = { user_id: meRec.id, display_name: name, discord_id: String(Date.now()), iriam_id: null, role, active:true };
      save(d);
    },
    async start(){ return this.status(); },
    async status(){
      if(!meRec) return { state:"demo_login" };
      const d = read(), m = d.members[meRec.id];
      if(!m) return { state:"demo_login" };
      const b = activeBan(d, meRec.id);
      if(b) return { state:"banned", reason:b.reason, until:b.until };
      const meObj = { id:m.user_id, name:m.display_name, role:m.role, iriam:m.iriam_id };
      if(!m.iriam_id) return { state:"need_iriam", me:meObj };
      return { state:"ready", me:meObj, warnings: d.warnings.filter(w => w.user_id===meRec.id && !w.read_at) };
    },
    async setIriam(v){ const d = read(); if(d.members[meRec.id] && !d.members[meRec.id].iriam_id) d.members[meRec.id].iriam_id = v; save(d); },
    async dailyReset(at){
      const d = read();
      if(d.lastReset === at) return;          // another tab already did it
      const ids = d.strokes.map(s => s.id);
      d.strokes = []; d.lastReset = at;
      d.log.unshift({ id: d.seq++, actor: null, action: "auto_clear", target: null, detail: ids.length + "本", created_at: new Date().toISOString() });
      save(d); post({ type:"del", ids });
    },
    async setNickname(v){ const d = read(); const m = d.members[meRec.id]; if(m){ if(!m.discord_name) m.discord_name = m.display_name; m.display_name = cleanName(v) || m.display_name; } save(d); },
    async loadStrokes(){ return read().strokes.map(validStroke).filter(Boolean); },
    async addStroke(s){ const d = read(); if(activeBan(d, meRec.id)) return deny("not_member"); d.strokes.push({ ...s, by: meRec.id }); save(d); post({ type:"ins", s:{ ...s, by: meRec.id } }); },
    async deleteStroke(id){
      const d = read(), s = d.strokes.find(x => x.id===id);
      if(s && s.by !== meRec.id) return deny("not_allowed");
      d.strokes = d.strokes.filter(x => x.id!==id); save(d); post({ type:"del", ids:[id] });
    },
    async eraseStrokes(removed, pieces){
      const d = read(), orig = new Map(d.strokes.filter(s => removed.includes(s.id)).map(s => [s.id, s]));
      const others = [...orig.values()].filter(s => s.by !== meRec.id);
      if(others.length && !isStaff()) return deny("not_allowed");
      const added = [];
      for(const pc of pieces){ const o = orig.get(pc.src); if(o) added.push({ id:pc.id, c:o.c, w:o.w, p:pc.p, t:o.t, by:o.by }); }
      for(const o of orig.values()) d.trash.push({ ...o, deleted_by: meRec.id });
      d.strokes = d.strokes.filter(s => !orig.has(s.id)).concat(added);
      const byUser = new Map(); for(const o of others) byUser.set(o.by, (byUser.get(o.by)||0)+1);
      for(const [u, n] of byUser) log(d, "erase", u, n + "本の線を消した");
      save(d);
      post({ type:"del", ids:[...orig.keys()] }); for(const s of added) post({ type:"ins", s });
    },
    async restoreStrokes(trashIds, removeIds){
      const d = read();
      const rem = new Set(removeIds || []);
      if(d.strokes.some(s => rem.has(s.id) && s.by !== meRec.id) && !isStaff()) return deny("not_allowed");
      d.strokes = d.strokes.filter(s => !rem.has(s.id));
      const back = d.trash.filter(t => trashIds.includes(t.id) && t.deleted_by === meRec.id);
      d.trash = d.trash.filter(t => !back.includes(t));
      const rows = back.map(({ deleted_by, ...s }) => s);
      d.strokes.push(...rows); save(d);
      post({ type:"del", ids:[...rem] }); for(const s of rows) post({ type:"ins", s });
      return rows.map(validStroke).filter(Boolean);
    },
    async ackWarning(id){ const d = read(); const w = d.warnings.find(x => x.id===id && x.user_id===meRec.id); if(w) w.read_at = new Date().toISOString(); save(d); },
    async profiles(ids){ const d = read(), map = {}; for(const id of ids){ const m = d.members[id]; if(m) map[id] = { name: m.display_name }; } return map; },
    subscribe(handlers){
      h = handlers;
      if(bc) bc.onmessage = ev => {
        const m = ev.data || {};
        if(m.type==="ins" && m.s){ const s = validStroke(m.s); if(s) h.onInsert(s); }
        else if(m.type==="del") for(const id of m.ids||[]) h.onDelete(id);
        else if(m.type==="ink") h.onInk({ data:m.data, sameTab:false, peer:m.key });
        else if(m.type==="pres"){ peers.set(m.key, { meta:m.meta, at:Date.now() }); emitPeers(); }
        else if(m.type==="leave"){ peers.delete(m.key); emitPeers(); }
        else if(m.type==="hello"){ if(myMeta) post({ type:"pres", key:key(), meta:myMeta }); }
        else if(m.type==="warn" && m.w && meRec && m.w.user_id===meRec.id) h.onWarning(m.w);
        else if(m.type==="ban" && meRec && m.uid===meRec.id) h.onBanChanged();
      };
      post({ type:"hello" });
      h.onConnection(true);
      clearInterval(hb);
      hb = setInterval(()=>{
        if(myMeta) post({ type:"pres", key:key(), meta:myMeta });
        const now = Date.now(); let ch = false;
        for(const [k, v] of peers) if(now - v.at > 12000){ peers.delete(k); ch = true; }
        if(ch) emitPeers();
      }, 4000);
      window.addEventListener("pagehide", ()=> post({ type:"leave", key:key() }));
    },
    unsubscribe(){ clearInterval(hb); post({ type:"leave", key: meRec && key() }); if(bc) bc.onmessage = null; h = null; },
    sendInk(data){ post({ type:"ink", key:key(), data }); return Promise.resolve(); },
    setPresence(meta){ myMeta = { ...meta, uid: meRec.id, at: Date.now() }; myAt = Date.now(); post({ type:"pres", key:key(), meta:myMeta }); emitPeers(); },
    // staff
    async members(){
      if(!isStaff()) return deny("not_staff");
      const d = read();
      return Object.values(d.members).map(m => {
        const b = activeBan(d, m.user_id);
        return { ...m, verified_at: null, stroke_count: d.strokes.filter(s => s.by===m.user_id).length,
          warning_count: d.warnings.filter(w => w.user_id===m.user_id).length,
          banned: !!b, ban_until: b ? b.until : null, ban_reason: b ? b.reason : null };
      }).sort((a,b)=> String(a.display_name).localeCompare(String(b.display_name), "ja"));
    },
    async warn(uid, msg){ if(!isStaff()) return deny("not_staff"); const d = read(); const w = { id:d.seq++, user_id:uid, message:msg, created_at:new Date().toISOString(), read_at:null }; d.warnings.push(w); log(d, "warn", uid, msg); save(d); post({ type:"warn", w }); },
    async ban(uid, days, reason){ if(!isStaff()) return deny("not_staff"); if(uid===meRec.id) return deny("cannot_ban_self"); const d = read(); d.bans[uid] = { until: days ? Date.now()+days*864e5 : null, reason }; log(d, "ban", uid, (days ? days+"日" : "無期限") + " / " + reason); save(d); post({ type:"ban", uid }); },
    async unban(uid){ if(!isStaff()) return deny("not_staff"); const d = read(); delete d.bans[uid]; log(d, "unban", uid); save(d); post({ type:"ban", uid }); },
    async deleteUserStrokes(uid){ if(!isStaff()) return deny("not_staff"); const d = read(); const gone = d.strokes.filter(s => s.by===uid); for(const s of gone) d.trash.push({ ...s, deleted_by: meRec.id }); d.strokes = d.strokes.filter(s => s.by!==uid); log(d, "delete_all_of_user", uid, gone.length+"本"); save(d); post({ type:"del", ids: gone.map(s=>s.id) }); return gone.length; },
    async clearAll(){ if(!isStaff()) return deny("not_staff"); const d = read(); const n = d.strokes.length; for(const s of d.strokes) d.trash.push({ ...s, deleted_by: meRec.id }); const ids = d.strokes.map(s=>s.id); d.strokes = []; log(d, "clear_all", null, n+"本"); save(d); post({ type:"del", ids }); return n; },
    async setIriamFor(uid, v){ if(!isStaff()) return deny("not_staff"); const d = read(); if(d.members[uid]) d.members[uid].iriam_id = v || null; log(d, "set_iriam", uid, v); save(d); },
    async modLog(){ if(!isStaff()) return deny("not_staff"); return read().log.slice(0, 100); }
  };
}

/* ============ BOOT ============ */
(async function boot(){
  const cfg = window.DRAWROOM_CONFIG || {};
  const useSupabase = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
  if(useSupabase && !window.supabase){ gate("error", { message:"Supabaseのライブラリを読み込めませんでした" }); return; }
  api = useSupabase ? createSupabaseApi(cfg) : createDemoApi();
  applyWriteState();
  gate("loading");
  try{ handleStatus(await api.start()); }
  catch(err){ gate("error", { message: errText(err) }); }
})();
})();
</script>
